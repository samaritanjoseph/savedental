<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Scan to Open on Phone</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f0f4ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.12);
      text-align: center;
    }
    h1 { font-size: 1.4rem; color: #1a1a2e; margin-bottom: 6px; }
    p  { color: #666; margin-bottom: 24px; font-size: 0.95rem; }
    #qr { margin: 0 auto 20px; }
    .url {
      background: #f0f4ff;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 0.9rem;
      color: #3b5bdb;
      font-weight: 600;
      word-break: break-all;
    }
    small { display:block; margin-top:16px; color:#aaa; font-size:0.78rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📱 Scan to open on your phone</h1>
    <p>Make sure your phone is on the same Wi-Fi</p>
    <div id="qr"></div>
    <div class="url">http://192.168.1.107:5173</div>
    <small>Dev server must be running on your PC</small>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    QRCode.toCanvas(document.createElement('canvas'), 'http://192.168.1.107:5173', {
      width: 260,
      margin: 2,
      color: { dark: '#1a1a2e', light: '#ffffff' }
    }, function(err, canvas) {
      if (!err) document.getElementById('qr').appendChild(canvas);
    });
  </script>
</body>
</html>
